<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewardMinty | Premium Digital Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00b894; --secondary: #00cec9; --dark-bg: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #0b0f19 80%);
            color: #ffffff; overflow-x: hidden;
        }

        /* Nav Section */
        nav { padding: 25px 5%; display: flex; justify-content: center; }
        .logo-box {
            display: flex; align-items: center; gap: 12px; background: var(--card-bg);
            padding: 10px 25px; border-radius: 100px; border: 1px solid var(--border);
            backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .logo-box img { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--primary); }

        /* Hero Section */
        .hero { text-align: center; padding: 40px 20px 20px; }
        h1 { 
            font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; margin: 0; 
            background: linear-gradient(to right, #fff, #00cec9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        /* Bento Grid Layout */
        .bento-container {
            max-width: 1000px; margin: 0 auto 60px;
            display: grid; grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(160px, auto); gap: 20px; padding: 0 20px;
        }

        .bento-card {
            background: var(--card-bg); border: 1px solid var(--border);
            backdrop-filter: blur(20px); border-radius: 30px; padding: 30px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bento-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .main-reward { grid-column: span 2; grid-row: span 2; }

        .reward-img {
            width: 100%; border-radius: 20px; margin: 20px 0;
            border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .btn-claim {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000; border: none; padding: 22px; font-size: 1.3rem;
            font-weight: 800; border-radius: 20px; width: 100%;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }

        /* Floating Winner Toast */
        #toast-container { position: fixed; bottom: 30px; left: 30px; z-index: 1000; }
        .toast {
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--primary);
            padding: 15px 25px; border-radius: 15px; display: flex; align-items: center;
            gap: 15px; backdrop-filter: blur(10px); animation: slideIn 0.5s ease;
        }

        /* Modal Styling */
        .modal { display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { background:#1e293b; margin:10% auto; padding:40px; width:80%; max-width:600px; border-radius:24px; border: 1px solid var(--border); line-height: 1.6; color: #cbd5e1; }
        .close-btn { background: var(--primary); color:#000; border:none; padding:12px 24px; border-radius:12px; cursor:pointer; margin-top:20px; font-weight: bold; }

        footer { padding: 40px; text-align: center; color: #475569; font-size: 0.85rem; border-top: 1px solid var(--border); }
        footer a { color: var(--primary); text-decoration: none; margin: 0 12px; cursor: pointer; }

        @keyframes slideIn { from { transform: translateX(-120%); } to { transform: translateX(0); } }
        @media (max-width: 768px) { .bento-container { grid-template-columns: 1fr; } .main-reward { grid-column: span 1; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo-box">
            <img src="logo.png" alt="RM">
            <span style="font-weight: 800; font-size: 1.1rem; color: #fff; letter-spacing: 1px;">REWARDMINTY</span>
        </div>
    </nav>

    <div class="hero">
        <h1>Unlock Daily Rewards</h1>
        <p style="color: #94a3b8; font-size: 1.1rem; margin-top: 10px;">The most trusted premium giveaway portal of 2026.</p>
    </div>

    <div class="bento-container">
        <div class="bento-card main-reward">
            <h2 style="margin:0;">Featured Giveaway</h2>
            <img src="cover.png" alt="Reward" class="reward-img">
            <button class="btn-claim" onclick="callLocker()">Claim Entry Now</button>
        </div>

        <div class="bento-card">
            <h3 style="margin:0; font-size: 0.8rem; color: var(--primary);">LIVE ACTIVITY</h3>
            <p style="font-size: 2.2rem; font-weight: 800; margin: 10px 0;">1,429</p>
            <p style="color: #94a3b8; margin: 0; font-size: 0.8rem;">Users currently verifying human status.</p>
        </div>

        <div class="bento-card">
            <h3 style="margin:0; font-size: 0.8rem; color: var(--secondary);">STATUS</h3>
            <p style="font-size: 1.2rem; font-weight: 600; margin: 10px 0;">System Secure</p>
            <p style="color: #94a3b8; margin: 0; font-size: 0.8rem;">SSL 256-bit encryption active.</p>
        </div>
    </div>

    <div id="toast-container"></div>

    <footer>
        &copy; 2026 RewardMinty. All Rights Reserved. <br><br>
        <a onclick="showLegal('privacy')">Privacy Policy</a> | 
        <a onclick="showLegal('terms')">Terms of Service</a>
    </footer>

    <div id="legalModal" class="modal"><div class="modal-content" id="legalContent"></div></div>

    <script>
        // Winner Toast Logic
        const winners = [
            {name: "John D.", loc: "USA", prize: "$100 Gift Card"},
            {name: "Anita R.", loc: "India", prize: "₹1000 Rewards"},
            {name: "Liam S.", loc: "UK", prize: "£50 Gift Card"}
        ];

        function showWinner() {
            const container = document.getElementById('toast-container');
            const winner = winners[Math.floor(Math.random() * winners.length)];
            container.innerHTML = `<div class="toast"><span><strong>${winner.name}</strong> (${winner.loc}) claimed <strong>${winner.prize}</strong></span></div>`;
            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }
        setInterval(showWinner, 8000);

        // Legal Content Logic
        function showLegal(type) {
            const modal = document.getElementById('legalModal');
            const content = document.getElementById('legalContent');
            const texts = {
                privacy: `<h2>Privacy Policy</h2><p>RewardMinty.com respects your privacy. We only process non-sensitive technical data (IP and device type) to confirm task completion. Your information is protected under global data protection regulations and is never shared with unauthorized third parties.</p>`,
                terms: `<h2>Terms of Service</h2><p>By using this site, you agree to complete human verification tasks fairly. Use of VPNs, bots, or automated software is strictly prohibited. Rewards are provided by third-party sponsors upon successful task completion. Must be 18+ to participate.</p>`
            };
            content.innerHTML = texts[type] + '<button class="close-btn" onclick="document.getElementById(\'legalModal\').style.display=\'none\'">Accept & Close</button>';
            modal.style.display = 'block';
        }

        function callLocker() {
            alert("Redirecting to Secure Verification Portal...");
            // Your CPAGrip Code Here
        }
    </script>
</body>
</html>
